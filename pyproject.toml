[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maajun"
version = "0.1.0"
description = "AI-powered developer assistant — chat with an AI directly from your terminal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.13.4",
    "keyring>=25.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "tomlkit>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
maajun = "maajun.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/maajun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["maajun"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
