[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "maajun"
version = "0.4.0"
description = "Error monitoring that files the bug report — and can write the fix."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Morvin", email = "morvinian@gmail.com" }]
keywords = [
    "error-monitoring",
    "observability",
    "incident-response",
    "ai",
    "llm",
    "agent",
    "github",
    "devops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "openai>=1.0.0",
    "anthropic>=1.0.0",
    "pydantic>=2.13.4",
    "keyring>=25.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "tomlkit>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Morvin-Ian/maajun"
Repository = "https://github.com/Morvin-Ian/maajun"
Documentation = "https://github.com/Morvin-Ian/maajun/blob/main/docs/monitoring.md"
Issues = "https://github.com/Morvin-Ian/maajun/issues"

[project.scripts]
maajun = "maajun.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/maajun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["maajun"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# W catches trailing whitespace and blank-line issues that reviews kept
# picking up by hand.
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
